<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">WiseGrid favicon</title>
  <desc id="desc">A teal gradient ribbon-style W with four rounded grid squares on a deep teal rounded-square background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#073e42"/>
      <stop offset="1" stop-color="#062f34"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00a99b"/>
      <stop offset="0.52" stop-color="#21d5b5"/>
      <stop offset="1" stop-color="#009b91"/>
    </linearGradient>
    <linearGradient id="ribbonShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#087f7c"/>
      <stop offset="1" stop-color="#0bb8a5"/>
    </linearGradient>
    <linearGradient id="tiles" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00b5a4"/>
      <stop offset="1" stop-color="#35dfbd"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="248" height="248" rx="48" fill="url(#bg)"/>
  <!-- Four grid tiles -->
  <g fill="url(#tiles)">
    <rect x="166" y="43" width="25" height="25" rx="6"/>
    <rect x="197" y="43" width="25" height="25" rx="6"/>
    <rect x="166" y="74" width="25" height="25" rx="6"/>
    <rect x="197" y="74" width="25" height="25" rx="6"/>
  </g>
  <!-- Interlocking ribbon W -->
  <path d="M34 111 Q32 106 39 106 L62 106 Q71 106 75 115 L99 160 L117 127 Q123 116 134 116 L146 116 Q157 116 163 128 L179 160 L198 121 Q202 112 212 112 L224 112 Q230 112 227 119 L197 184 Q192 195 181 195 L174 195 Q164 195 159 185 L140 151 L121 185 Q116 195 105 195 L98 195 Q87 195 81 184 Z" fill="url(#ribbon)"/>
  <!-- subtle crossing folds for the ribbon effect -->
  <path d="M75 115 Q80 115 84 123 L104 160 L91 181 Q87 188 81 184 L57 143 Z" fill="url(#ribbonShade)"/>
  <path d="M117 127 Q123 116 134 116 L146 116 Q157 116 163 128 L179 160 L166 184 Q163 190 159 185 L140 151 L121 185 Q116 195 105 195 L98 195 Q91 195 86 190 L116 143 Q121 135 117 127 Z" fill="url(#ribbon)"/>
</svg>
